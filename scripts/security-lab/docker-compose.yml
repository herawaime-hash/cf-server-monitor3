services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: lab-zap
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks: [lab]
    volumes:
      - lab_reports:/reports
      - lab_evidence:/evidence

  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: lab-nuclei
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks: [lab]
    volumes:
      - lab_reports:/reports

  httpx:
    image: projectdiscovery/httpx:latest
    container_name: lab-httpx
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks: [lab]
    volumes:
      - lab_reports:/reports

  ffuf:
    image: ghcr.io/ffuf/ffuf:latest
    container_name: lab-ffuf
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks: [lab]
    volumes:
      - lab_reports:/reports

  subfinder:
    image: projectdiscovery/subfinder:latest
    container_name: lab-subfinder
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks: [lab]
    volumes:
      - lab_reports:/reports

  amass:
    image: caffix/amass:latest
    container_name: lab-amass
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks: [lab]
    volumes:
      - lab_reports:/reports

  newman:
    image: postman/newman:alpine
    container_name: lab-newman
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks: [lab]
    volumes:
      - lab_reports:/reports
      - lab_workspace:/workspace

  k6:
    image: grafana/k6:latest
    container_name: lab-k6
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks: [lab]
    volumes:
      - lab_reports:/reports
      - lab_workspace:/workspace

  nmap:
    image: instrumentisto/nmap:latest
    container_name: lab-nmap
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks: [lab]
    volumes:
      - lab_reports:/reports

networks:
  lab:
    name: security-lab-network

volumes:
  lab_reports:
  lab_evidence:
  lab_workspace:
